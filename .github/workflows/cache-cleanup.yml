# Deletes a pull request's Actions caches once it is closed or merged.
# No other branch can read them, and they count toward the repo's 10 GB
# limit, where they would evict main's caches.
name: Cache cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id"
          done
          echo "Deleted $(echo "$ids" | grep -c . || true) caches for $REF"
