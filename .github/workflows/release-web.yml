# Publish a downloadable web build for version tags. Production hosting is
# still deployed from main by deploy-web.yml.
name: Release web

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  FRB_VERSION: 2.13.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  release:
    name: Build and publish web release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          else
            tag="${PUSH_REF#refs/tags/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag like v1.2.3; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        id: version

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Build the bridge with atomics (wasm threads), which needs nightly and rust-src.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - uses: cargo-bins/cargo-binstall@main

      - name: Install bridge tools
        run: cargo binstall -y --force flutter_rust_bridge_codegen@${{ env.FRB_VERSION }} wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Copy content into app assets
        run: python tools/sync_content.py

      - name: Vendor onnxruntime-web for practice mode (sha256-pinned)
        run: python tools/melody-model/web/fetch_ort.py --dest app/web/melody/vendor --wasm-only

      - name: Stage the melody model (sha256 against the release manifest)
        run: python tools/melody-model/web/stage_app_model.py --release

      - name: Build Rust core for web
        working-directory: app
        run: |
          flutter pub get
          flutter_rust_bridge_codegen build-web --release

      - name: Build Flutter web
        working-directory: app
        run: flutter build web --release

      - name: Check COOP/COEP headers file is in the build
        run: grep -q "Cross-Origin-Embedder-Policy" app/build/web/_headers

      - name: Package web build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd app/build/web
          zip -qr "$GITHUB_WORKSPACE/easy-piano-web-${RELEASE_TAG}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" "easy-piano-web-${RELEASE_TAG}.zip" --generate-notes --title "Easy Piano ${RELEASE_TAG}"
