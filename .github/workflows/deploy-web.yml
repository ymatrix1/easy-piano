# Builds the Flutter web app (with the Rust/wasm core) and publishes it to
# Cloudflare Pages: production on push to main, a preview per pull request.
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit), CLOUDFLARE_ACCOUNT_ID.
name: Deploy web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FLUTTER_VERSION: 3.47.7
  FRB_VERSION: 2.13.0
  WASM_PACK_VERSION: 0.15.0
  PAGES_PROJECT: easy-piano

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The web bridge is built with atomics (wasm threads), which needs
      # nightly and rust-src for -Z build-std.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - uses: cargo-bins/cargo-binstall@main

      - name: Install bridge tools
        run: cargo binstall -y --force flutter_rust_bridge_codegen@${{ env.FRB_VERSION }} wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Copy content into app assets
        run: python tools/sync_content.py

      - name: Vendor onnxruntime-web for practice mode (sha256-pinned)
        run: python tools/melody-model/web/fetch_ort.py --dest app/web/melody/vendor --wasm-only

      - name: Stage the melody model for practice mode (sha256 against the release manifest)
        run: python tools/melody-model/web/stage_app_model.py --release

      - name: Build Rust core for web
        working-directory: app
        run: |
          flutter pub get
          flutter_rust_bridge_codegen build-web --release

      - name: Build Flutter web
        working-directory: app
        run: flutter build web --release

      - name: Check COOP/COEP headers file is in the build
        run: grep -q "Cross-Origin-Embedder-Policy" app/build/web/_headers

      # Creates the Pages project on first run. Real failures (auth, network) still fail the job.
      - name: Ensure Pages project exists
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      # Fork PRs get no secrets: build only.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v8
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- deploy-web-preview -->';
            const body = `${marker}\n**Web preview:** ${process.env.ALIAS || process.env.URL}\n\nCommit: ${context.sha.slice(0, 7)} · deploy: ${process.env.URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
