# Pre-push checks from AGENTS.md, run on every PR and push to main.
# The web build (flutter_rust_bridge_codegen build-web + flutter build web)
# runs in deploy-web.yml on the same triggers, so it is not repeated here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with deploy-web.yml.
  FLUTTER_VERSION: 3.47.7

jobs:
  rust:
    name: Rust core + audio + content lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            audio
            tools/content-cli

      - name: cargo fmt (core)
        working-directory: core
        run: cargo fmt --check

      - name: cargo clippy (core)
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (core)
        working-directory: core
        run: cargo test

      - name: cargo fmt (audio)
        working-directory: audio
        run: cargo fmt --check

      - name: cargo clippy (audio)
        working-directory: audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
          cargo clippy --all-targets --all-features -- -D warnings

      # Includes the web parity test (renders Ode to Joy, D30).
      - name: cargo test (audio)
        working-directory: audio
        run: cargo test

      - name: cargo fmt (content-cli)
        working-directory: tools/content-cli
        run: cargo fmt --check

      - name: cargo clippy (content-cli)
        working-directory: tools/content-cli
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint content
        working-directory: tools/content-cli
        run: cargo run -- lint ../../content

  python:
    name: Python (melody-model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/melody-model
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: tools/melody-model/uv.lock

      # No --extra train: torch stays out of CI.
      - name: uv sync
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      # Slow/GPU-marked tests are deselected via addopts in pyproject.toml.
      - name: pytest
        run: uv run pytest

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}

      - name: Copy content into app assets
        run: python tools/sync_content.py

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: dart format
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        working-directory: app
        run: flutter analyze

      - name: flutter test
        working-directory: app
        run: flutter test

  android:
    name: Android APK + emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # cargokit builds into the app's build dir, not app/rust/target.
          workspaces: app/rust -> ../build/easy_piano_bridge/build
          # Keep the slow first build even if a later step (emulator) fails.
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}

      - name: Copy content into app assets
        run: python tools/sync_content.py

      # Phones are arm64-v8a. A build for one emulator ABI only (what
      # `flutter run` makes) crashes on them, so CI builds the phone APK.
      - name: Build release APK (arm64-v8a)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Check the APK carries the arm64 native libraries
        working-directory: app
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk > apk.txt
          grep -q 'lib/arm64-v8a/libflutter.so' apk.txt
          grep -q 'lib/arm64-v8a/libeasy_piano_bridge.so' apk.txt

      - uses: actions/upload-artifact@v7
        with:
          name: easy-piano-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD snapshot created"

      # Boots the real app on an emulator: loads the Rust library, content
      # and locale, and waits for the home screen.
      - name: Smoke test on emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app
          script: flutter test integration_test/app_smoke_test.dart integration_test/simple_test.dart
