<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Easy Piano: a free, open-source, gamified piano course.">
  <meta name="theme-color" content="#15104F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Easy Piano">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Piano</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loading splash: shown until Flutter paints its first frame. */
    html, body { margin: 0; height: 100%; background: #080726; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(circle at 50% 40%, #4422C9 0%, #15104F 45%, #080726 100%);
      font-family: system-ui, sans-serif; color: #B8B3F0;
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash { gap: clamp(20px, 5vmin, 44px); }
    #splash img { width: clamp(132px, 38vmin, 280px); height: clamp(132px, 38vmin, 280px);
      animation: bob 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(46, 230, 255, .35)); }
    #splash .bar { width: clamp(200px, 56vmin, 400px); height: clamp(8px, 1.8vmin, 14px);
      border-radius: 999px; overflow: hidden;
      background: #1A1458; box-shadow: inset 0 0 0 1px #4A3CC0; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #2EE6FF, #FFD21F); animation: slide 1.1s ease-in-out infinite; }
    #splash p { margin: 0; font-size: clamp(14px, 3.6vmin, 22px); letter-spacing: .12em; text-transform: uppercase; }
    @keyframes bob { 50% { transform: translateY(-8px) scale(1.03); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar i { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" role="status" aria-live="polite">
    <img src="favicon.svg" alt="Easy Piano">
    <div class="bar"><i></i></div>
    <p>Tuning the piano…</p>
  </div>
  <script>
    // Hide only on Flutter's first frame. The <flutter-view> element appears
    // as soon as the engine starts, long before main() finishes loading the
    // Rust core and content, so hiding on it left a blank screen. If boot
    // fails or stalls, say so and offer a reload instead of spinning forever.
    (function () {
      var s = document.getElementById('splash');
      var msg = s.querySelector('p');
      function hide() {
        if (!s.isConnected || s.classList.contains('done')) return;
        s.classList.add('done');
        setTimeout(function () { s.remove(); }, 400);
      }
      function fail(why) {
        if (!s.isConnected || s.classList.contains('done')) return;
        console.error('Easy Piano failed to load:', why);
        msg.innerHTML = 'Couldn’t load. <a href="" style="color:#2EE6FF">Reload</a>';
        s.querySelector('.bar').style.visibility = 'hidden';
      }
      window.addEventListener('flutter-first-frame', hide);
      window.addEventListener('error', function (e) { fail(e.message); });
      window.addEventListener('unhandledrejection', function (e) { fail(e.reason); });
      if (!window.crossOriginIsolated) console.warn('Not cross-origin isolated: check COOP/COEP headers.');
      // Visible-time budget: hidden tabs don't render, so don't count them.
      var waited = 0;
      var t = setInterval(function () {
        if (!s.isConnected) return clearInterval(t);
        if (!document.hidden) waited++;
        if (waited === 8) msg.textContent = 'Almost there…';
        if (waited === 45) { clearInterval(t); fail('timeout'); }
      }, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
