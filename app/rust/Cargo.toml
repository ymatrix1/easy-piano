[package]
name = "easy_piano_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
easy_piano_core = { path = "../../core" }
serde_json = "1"

# Native sound (D30 stage 2). Web keeps Web Audio until stage 3.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
easy_piano_audio = { path = "../../audio", features = ["decode", "output"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Dependencies (the audio engine above all) are optimized even in debug
# builds: an unoptimized engine can't keep up with the audio callback.
[profile.dev.package."*"]
opt-level = 3
