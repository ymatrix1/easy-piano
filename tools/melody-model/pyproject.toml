[project]
name = "melody-model"
version = "0.0.0"
description = "Practice-tune melody model: dataset build, filters and training (tooling, not shipped)"
requires-python = ">=3.11"
dependencies = [
    "music21==10.5.0",  # BSD-3-Clause; parsing only, not shipped
    "mido==1.3.3",  # MIT; timing of performed MIDI (timed.py)
]

[project.optional-dependencies]
# Heavy; CI does not install this. `uv sync --extra train` (CUDA wheels: see PyTorch index docs).
train = ["torch>=2.4", "safetensors==0.6.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not gpu'"
markers = [
    "slow: long-running test, skipped in CI",
    "gpu: needs a CUDA device, skipped in CI",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501: formatter owns wrapping, long strings/comments stay. B905: adding strict= changes behaviour.
ignore = ["E501", "B905"]
