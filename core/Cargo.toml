[package]
name = "easy_piano_core"
version = "0.1.0"
edition = "2021"
description = "Pure music logic for Easy Piano: notation, grading, session state. No I/O."
license = "MPL-2.0"

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
